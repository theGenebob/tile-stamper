<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tile Stamper</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #1b1b1b;
    color: #eee;
  }

  header {
    padding: 14px 20px;
    background: #111;
    border-bottom: 1px solid #444;
  }

  #header-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  header h1 {
    margin: 0;
    font-size: 22px;
  }

  #header-controls {
    display: flex;
    gap: 6px;
  }

  #app {
    display: flex;
    height: calc(100vh - 55px);
  }

  #sidebar {
    width: 240px;
    flex-shrink: 0;
    padding: 12px;
    background: #242424;
    border-right: 1px solid #555;
    overflow-y: auto;
  }

  button {
    background: #3a3a3a;
    color: #eee;
    border: 1px solid #666;
    border-radius: 4px;
    padding: 7px 10px;
    cursor: pointer;
  }

  button:hover {
    background: #4b4b4b;
  }

  button:disabled {
    opacity: .4;
    cursor: default;
  }

  #new-category {
    width: 100%;
    margin-bottom: 12px;
  }

  .category {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 5px;
  }

  .category-name {
    flex: 1;
    text-align: left;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .category-name.active {
    border-left: 4px solid #d4af37;
  }

  .category-edit,
  .category-delete {
    width: 30px;
    padding: 6px 0;
    flex-shrink: 0;
  }

  #main {
    flex: 1;
    min-width: 0;
    padding: 16px;
    overflow-y: auto;
  }

  #main-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 18px;
  }

  #category-title {
    margin: 0;
  }

  #tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, 130px);
    gap: 16px;
    align-items: start;
  }

  .tile-card {
    position: relative;
    width: 130px;
  }

  .tile-image {
    width: 130px;
    height: 130px;
    padding: 5px;
    border: 1px solid #666;
    border-radius: 7px;
    background: #111;
    cursor: grab;
    object-fit: contain;
    display: block;
  }

  .tile-image:active {
    cursor: grabbing;
  }

  .tile-name {
    margin-top: 5px;
    text-align: center;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tile-actions {
    position: absolute;
    top: 4px;
    right: 4px;
    display: flex;
    gap: 3px;
  }

  .tile-edit,
  .tile-delete {
    width: 26px;
    height: 26px;
    padding: 0;
    border-radius: 50%;
    background: rgba(35, 35, 35, .9);
  }

  #empty-message {
    opacity: .65;
    padding: 40px;
    text-align: center;
  }

  dialog {
    background: #292929;
    color: #eee;
    border: 1px solid #666;
    border-radius: 8px;
    padding: 20px;
    width: 400px;
    max-width: 90vw;
  }

  dialog::backdrop {
    background: rgba(0,0,0,.65);
  }

  dialog h2 {
    margin-top: 0;
  }

  dialog label {
    display: block;
    margin-top: 12px;
    margin-bottom: 4px;
  }

  dialog input {
    width: 100%;
    padding: 8px;
    background: #151515;
    color: white;
    border: 1px solid #666;
    border-radius: 4px;
  }

  .dialog-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
  }

  .dialog-buttons button {
    padding: 7px 12px;
  }

  #status {
    position: fixed;
    right: 15px;
    bottom: 15px;
    padding: 8px 12px;
    background: #111;
    border: 1px solid #555;
    border-radius: 5px;
    font-size: 12px;
    opacity: .85;
    pointer-events: none;
  }

  @media (max-width: 700px) {
    #header-inner {
      align-items: flex-start;
      flex-direction: column;
    }

    #app {
      height: calc(100vh - 95px);
    }

    #sidebar {
      width: 190px;
    }
  }
</style>
</head>

<body>

<header>

  <div id="header-inner">

    <h1>Tile Stamper</h1>

    <div id="header-controls">

      <button id="import-library">
        Import Library
      </button>

      <button id="export-library">
        Export Library
      </button>

    </div>

  </div>

  <input
    id="import-file"
    type="file"
    accept=".json,application/json"
    style="display:none;"
  >

</header>


<div id="app">

  <aside id="sidebar">

    <button id="new-category">
      + Category
    </button>

    <div id="categories"></div>

  </aside>


  <main id="main">

    <div id="main-header">

      <h2 id="category-title">
        Tile Library
      </h2>

      <button id="add-image">
        + Add Image
      </button>

    </div>

    <div id="tiles"></div>

  </main>

</div>


<div id="status">
  Drag a tile onto Foundry to place it.
</div>


<!-- IMAGE DIALOG -->

<dialog id="image-dialog">

  <h2 id="image-dialog-title">
    Add Image
  </h2>

  <label for="image-name">
    Name
  </label>

  <input
    id="image-name"
    type="text"
    placeholder="Oak Tree"
  >

  <label for="image-url">
    Image URL
  </label>

  <input
    id="image-url"
    type="text"
    placeholder="https://..."
  >

  <div class="dialog-buttons">

    <button id="image-cancel">
      Cancel
    </button>

    <button id="image-save">
      Add
    </button>

  </div>

</dialog>


<!-- CATEGORY EDIT DIALOG -->

<dialog id="category-dialog">

  <h2>
    Rename Category
  </h2>

  <label for="category-edit-name">
    Name
  </label>

  <input
    id="category-edit-name"
    type="text"
  >

  <div class="dialog-buttons">

    <button id="category-cancel">
      Cancel
    </button>

    <button id="category-save">
      Save
    </button>

  </div>

</dialog>


<script>

const STORAGE_KEY =
  "tileStamperLibrary";


let library =
  loadLibrary();


let selectedCategoryId =
  library.categories[0]?.id
  ?? null;


// Used by the edit dialogs.

let editingAssetId =
  null;


let editingCategoryId =
  null;


// ============================================================
// STORAGE
// ============================================================

function loadLibrary() {

  try {

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );


    if (saved) {

      const parsed =
        JSON.parse(
          saved
        );


      if (
        parsed &&
        Array.isArray(
          parsed.categories
        )
      ) {

        return parsed;

      }

    }

  }

  catch (err) {

    console.error(
      "Could not load Tile Stamper library:",
      err
    );

  }


  return {
    categories: []
  };
}


function saveLibrary() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
      library
    )
  );

}


// ============================================================
// IDS
// ============================================================

function makeId() {

  return crypto.randomUUID();

}


// ============================================================
// HELPERS
// ============================================================

function getSelectedCategory() {

  return (
    library.categories.find(
      category =>
        category.id ===
        selectedCategoryId
    )
    ?? null
  );

}


function deriveName(url) {

  try {

    const filename =
      url
        .split("/")
        .pop()
        .split("?")[0];


    return (
      decodeURIComponent(
        filename
      )
        .replace(
          /\.[^.]+$/,
          ""
        )
      ||
      "Image"
    );

  }

  catch {

    return "Image";

  }

}


// ============================================================
// RENDER
// ============================================================

function render() {

  renderCategories();
  renderTiles();

}


// ============================================================
// RENDER CATEGORIES
// ============================================================

function renderCategories() {

  const container =
    document.getElementById(
      "categories"
    );


  container.innerHTML =
    "";


  for (
    const category
    of library.categories
  ) {

    const row =
      document.createElement(
        "div"
      );


    row.className =
      "category";


    // CATEGORY NAME

    const button =
      document.createElement(
        "button"
      );


    button.className =
      "category-name";


    if (
      category.id ===
      selectedCategoryId
    ) {

      button.classList.add(
        "active"
      );

    }


    button.textContent =
      category.name;


    button.title =
      category.name;


    button.onclick = () => {

      selectedCategoryId =
        category.id;

      render();

    };


    // EDIT CATEGORY

    const editButton =
      document.createElement(
        "button"
      );


    editButton.className =
      "category-edit";


    editButton.textContent =
      "✎";


    editButton.title =
      "Rename Category";


    editButton.onclick =
      event => {

        event.stopPropagation();

        openCategoryEditor(
          category.id
        );

      };


    // DELETE CATEGORY

    const deleteButton =
      document.createElement(
        "button"
      );


    deleteButton.className =
      "category-delete";


    deleteButton.textContent =
      "×";


    deleteButton.title =
      "Delete Category";


    deleteButton.onclick =
      event => {

        event.stopPropagation();

        deleteCategory(
          category.id
        );

      };


    row.append(
      button,
      editButton,
      deleteButton
    );


    container.appendChild(
      row
    );

  }

}


// ============================================================
// RENDER TILES
// ============================================================

function renderTiles() {

  const category =
    getSelectedCategory();


  const title =
    document.getElementById(
      "category-title"
    );


  const container =
    document.getElementById(
      "tiles"
    );


  const addButton =
    document.getElementById(
      "add-image"
    );


  container.innerHTML =
    "";


  if (!category) {

    title.textContent =
      "Tile Library";


    addButton.disabled =
      true;


    container.innerHTML = `
      <div id="empty-message">
        Create a category to get started.
      </div>
    `;


    return;

  }


  title.textContent =
    category.name;


  addButton.disabled =
    false;


  if (
    !Array.isArray(
      category.assets
    )
  ) {

    category.assets =
      [];

  }


  if (
    !category.assets.length
  ) {

    container.innerHTML = `
      <div id="empty-message">
        This category is empty.
        <br><br>
        Click <strong>+ Add Image</strong>.
      </div>
    `;


    return;

  }


  for (
    const asset
    of category.assets
  ) {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "tile-card";


    // IMAGE

    const image =
      document.createElement(
        "img"
      );


    image.className =
      "tile-image";


    image.src =
      asset.src;


    image.draggable =
      true;


    image.title =
      "Drag onto the Foundry canvas";


    // ========================================================
    // FOUNDRY TILE DRAG PAYLOAD
    // ========================================================

    image.addEventListener(
      "dragstart",
      event => {

        const data = {

          type:
            "Tile",

          texture: {

            src:
              asset.src

          },

          width:
            300,

          height:
            300

        };


        event.dataTransfer.setData(
          "text/plain",
          JSON.stringify(
            data
          )
        );


        event.dataTransfer.effectAllowed =
          "copy";

      }
    );


    // TILE NAME

    const name =
      document.createElement(
        "div"
      );


    name.className =
      "tile-name";


    name.textContent =
      asset.name;


    name.title =
      asset.name;


    // ACTION BUTTON CONTAINER

    const actions =
      document.createElement(
        "div"
      );


    actions.className =
      "tile-actions";


    // EDIT IMAGE

    const editButton =
      document.createElement(
        "button"
      );


    editButton.className =
      "tile-edit";


    editButton.textContent =
      "✎";


    editButton.title =
      "Edit Image";


    editButton.onclick =
      event => {

        event.stopPropagation();

        openImageEditor(
          asset.id
        );

      };


    // DELETE IMAGE

    const deleteButton =
      document.createElement(
        "button"
      );


    deleteButton.className =
      "tile-delete";


    deleteButton.textContent =
      "×";


    deleteButton.title =
      "Delete Image";


    deleteButton.onclick =
      event => {

        event.stopPropagation();

        deleteImage(
          asset.id
        );

      };


    actions.append(
      editButton,
      deleteButton
    );


    card.append(
      image,
      actions,
      name
    );


    container.appendChild(
      card
    );

  }

}


// ============================================================
// CREATE CATEGORY
// ============================================================

document
  .getElementById(
    "new-category"
  )
  .onclick = () => {

    const name =
      prompt(
        "Category name:"
      );


    if (
      !name?.trim()
    ) {

      return;

    }


    const category = {

      id:
        makeId(),

      name:
        name.trim(),

      assets:
        []

    };


    library.categories.push(
      category
    );


    selectedCategoryId =
      category.id;


    saveLibrary();

    render();

  };


// ============================================================
// EDIT CATEGORY
// ============================================================

const categoryDialog =
  document.getElementById(
    "category-dialog"
  );


function openCategoryEditor(
  categoryId
) {

  const category =
    library.categories.find(
      c =>
        c.id ===
        categoryId
    );


  if (!category)
    return;


  editingCategoryId =
    categoryId;


  const input =
    document.getElementById(
      "category-edit-name"
    );


  input.value =
    category.name;


  categoryDialog.showModal();


  input.focus();

  input.select();

}


document
  .getElementById(
    "category-cancel"
  )
  .onclick = () => {

    editingCategoryId =
      null;

    categoryDialog.close();

  };


document
  .getElementById(
    "category-save"
  )
  .onclick = () => {

    if (!editingCategoryId)
      return;


    const category =
      library.categories.find(
        c =>
          c.id ===
          editingCategoryId
      );


    if (!category)
      return;


    const name =
      document
        .getElementById(
          "category-edit-name"
        )
        .value
        .trim();


    if (!name) {

      alert(
        "Enter a category name."
      );

      return;

    }


    category.name =
      name;


    editingCategoryId =
      null;


    saveLibrary();

    categoryDialog.close();

    render();

  };


// Allow Enter to save category rename.

document
  .getElementById(
    "category-edit-name"
  )
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        document
          .getElementById(
            "category-save"
          )
          .click();

      }

    }
  );


// ============================================================
// DELETE CATEGORY
// ============================================================

function deleteCategory(
  categoryId
) {

  const category =
    library.categories.find(
      c =>
        c.id ===
        categoryId
    );


  if (!category)
    return;


  const confirmed =
    confirm(
      `Delete "${category.name}" and its ${category.assets?.length ?? 0} image(s)?`
    );


  if (!confirmed)
    return;


  library.categories =
    library.categories.filter(
      c =>
        c.id !==
        categoryId
    );


  if (
    selectedCategoryId ===
    categoryId
  ) {

    selectedCategoryId =
      library.categories[0]?.id
      ?? null;

  }


  saveLibrary();

  render();

}


// ============================================================
// IMAGE DIALOG
// ============================================================

const imageDialog =
  document.getElementById(
    "image-dialog"
  );


const imageDialogTitle =
  document.getElementById(
    "image-dialog-title"
  );


const imageNameInput =
  document.getElementById(
    "image-name"
  );


const imageUrlInput =
  document.getElementById(
    "image-url"
  );


const imageSaveButton =
  document.getElementById(
    "image-save"
  );


// ============================================================
// ADD IMAGE
// ============================================================

document
  .getElementById(
    "add-image"
  )
  .onclick = () => {

    editingAssetId =
      null;


    imageDialogTitle.textContent =
      "Add Image";


    imageSaveButton.textContent =
      "Add";


    imageNameInput.value =
      "";


    imageUrlInput.value =
      "";


    imageDialog.showModal();


    imageUrlInput.focus();

  };


// ============================================================
// EDIT IMAGE
// ============================================================

function openImageEditor(
  assetId
) {

  const category =
    getSelectedCategory();


  if (!category)
    return;


  const asset =
    category.assets.find(
      a =>
        a.id ===
        assetId
    );


  if (!asset)
    return;


  editingAssetId =
    assetId;


  imageDialogTitle.textContent =
    "Edit Image";


  imageSaveButton.textContent =
    "Save";


  imageNameInput.value =
    asset.name;


  imageUrlInput.value =
    asset.src;


  imageDialog.showModal();


  imageNameInput.focus();

  imageNameInput.select();

}


// ============================================================
// CANCEL IMAGE DIALOG
// ============================================================

document
  .getElementById(
    "image-cancel"
  )
  .onclick = () => {

    editingAssetId =
      null;

    imageDialog.close();

  };


// ============================================================
// SAVE IMAGE
// ============================================================

imageSaveButton.onclick = () => {

  const category =
    getSelectedCategory();


  if (!category)
    return;


  const url =
    imageUrlInput
      .value
      .trim();


  let name =
    imageNameInput
      .value
      .trim();


  if (!url) {

    alert(
      "Enter an image URL."
    );

    return;

  }


  if (!name) {

    name =
      deriveName(
        url
      );

  }


  // EDIT EXISTING IMAGE

  if (editingAssetId) {

    const asset =
      category.assets.find(
        a =>
          a.id ===
          editingAssetId
      );


    if (!asset)
      return;


    asset.name =
      name;


    asset.src =
      url;

  }


  // ADD NEW IMAGE

  else {

    category.assets.push({

      id:
        makeId(),

      name,

      src:
        url

    });

  }


  editingAssetId =
    null;


  saveLibrary();

  imageDialog.close();

  render();

};


// Allow Enter to save from image fields.

imageNameInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      imageSaveButton.click();

    }

  }
);


imageUrlInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      imageSaveButton.click();

    }

  }
);


// ============================================================
// DELETE IMAGE
// ============================================================

function deleteImage(
  assetId
) {

  const category =
    getSelectedCategory();


  if (!category)
    return;


  const asset =
    category.assets.find(
      a =>
        a.id ===
        assetId
    );


  if (!asset)
    return;


  if (
    !confirm(
      `Delete "${asset.name}"?`
    )
  ) {

    return;

  }


  category.assets =
    category.assets.filter(
      a =>
        a.id !==
        assetId
    );


  saveLibrary();

  render();

}


// ============================================================
// EXPORT LIBRARY
// ============================================================

document
  .getElementById(
    "export-library"
  )
  .onclick = () => {

    const exportData = {

      version:
        1,

      exportedAt:
        new Date().toISOString(),

      categories:
        library.categories

    };


    const json =
      JSON.stringify(
        exportData,
        null,
        2
      );


    const blob =
      new Blob(
        [json],
        {
          type:
            "application/json"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      url;


    const date =
      new Date()
        .toISOString()
        .slice(
          0,
          10
        );


    link.download =
      `tile-stamper-library-${date}.json`;


    document.body.appendChild(
      link
    );


    link.click();

    link.remove();


    URL.revokeObjectURL(
      url
    );

  };


// ============================================================
// IMPORT LIBRARY
// ============================================================

const importFile =
  document.getElementById(
    "import-file"
  );


document
  .getElementById(
    "import-library"
  )
  .onclick = () => {

    importFile.value =
      "";

    importFile.click();

  };


importFile.addEventListener(
  "change",

  async event => {

    const file =
      event.target.files?.[0];


    if (!file)
      return;


    try {

      const text =
        await file.text();


      const imported =
        JSON.parse(
          text
        );


      if (
        !imported ||
        !Array.isArray(
          imported.categories
        )
      ) {

        throw new Error(
          "Invalid Tile Stamper library."
        );

      }


      // Normalize the imported data so older
      // exports still work if IDs are missing.

      const normalized = {

        categories:
          imported.categories.map(
            category => {

              const categoryId =
                category.id
                ||
                makeId();


              const assets =
                Array.isArray(
                  category.assets
                )
                ?
                category.assets
                  .map(
                    asset => {

                      const src =
                        String(
                          asset.src
                          ??
                          ""
                        ).trim();


                      if (!src)
                        return null;


                      return {

                        id:
                          asset.id
                          ||
                          makeId(),

                        name:
                          String(
                            asset.name
                            ||
                            deriveName(
                              src
                            )
                          ),

                        src

                      };

                    }
                  )
                  .filter(
                    Boolean
                  )
                :
                [];


              return {

                id:
                  categoryId,

                name:
                  String(
                    category.name
                    ||
                    "Unnamed Category"
                  ),

                assets

              };

            }
          )

      };


      const tileCount =
        normalized.categories.reduce(
          (
            total,
            category
          ) =>
            total +
            category.assets.length,
          0
        );


      const confirmed =
        confirm(
          `Import ${normalized.categories.length} categories and ${tileCount} images?\n\nThis will replace your current Tile Stamper library.`
        );


      if (!confirmed)
        return;


      library =
        normalized;


      selectedCategoryId =
        library.categories[0]?.id
        ?? null;


      saveLibrary();

      render();


      alert(
        "Tile Stamper library imported successfully."
      );

    }

    catch (err) {

      console.error(
        "Tile Stamper import failed:",
        err
      );


      alert(
        "That file could not be imported as a Tile Stamper library."
      );

    }

  }
);


// ============================================================
// CLOSE DIALOGS WITH ESCAPE / CLEAN EDIT STATE
// ============================================================

imageDialog.addEventListener(
  "close",
  () => {

    editingAssetId =
      null;

  }
);


categoryDialog.addEventListener(
  "close",
  () => {

    editingCategoryId =
      null;

  }
);


// ============================================================
// START
// ============================================================

render();

</script>

</body>
</html>
